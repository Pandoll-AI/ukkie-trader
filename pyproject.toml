[project]
name = "ukkie-trader"
version = "0.1.0"
description = "Prudent crypto trading for the orangutan in you"
authors = [
    {name = "Emergency Lee", email = "emergencylee@outlook.com"},
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]
requires-python = ">=3.11"

[project.scripts]
ukkie-trader = "ukkie_trader.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
